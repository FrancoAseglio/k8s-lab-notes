# =============================================================================
# map-label.yml  -  a MutatingAdmissionPolicy: label every pod (used in lab step 77)
# =============================================================================
# Used with:   kubectl apply -f map-label.yml
#
# Where a validating policy says yes or no, a MUTATING policy CHANGES the object before it is
# stored. Also written in CEL, also two objects (policy + binding). This one adds a label to
# every Pod created in a namespace labelled policy=enforced.
#
#   patchType: ApplyConfiguration   the expression returns a partial object MERGED into the
#                                   incoming one (server-side apply semantics)
#   Object{...}                     builds an object of the type being mutated
#   reinvocationPolicy: IfNeeded    may run again if another mutating step changed the object
#
# Mutation happens BEFORE validation, so validating policies and Pod Security see the result.
# Requires Kubernetes 1.36 or later (API admissionregistration.k8s.io/v1).
#
# EXPECT: `kubectl get pods -n vap-demo --show-labels` shows admission.lab/policy on new pods.
# =============================================================================
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: label-admitted-pods
spec:
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  mutations:
  - patchType: "ApplyConfiguration"
    applyConfiguration:
      expression: "Object{metadata: Object.metadata{labels: {'admission.lab/policy': 'label-admitted-pods'}}}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: label-admitted-pods-binding
spec:
  policyName: label-admitted-pods
  matchResources:
    namespaceSelector:
      matchLabels:
        policy: enforced
