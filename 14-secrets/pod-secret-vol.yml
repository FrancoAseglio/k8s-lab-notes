# =============================================================================
# pod-secret-vol.yml  -  Secret as files in a volume (used in lab steps 49 and 51)
# =============================================================================
# Used with:   kubectl apply -f pod-secret-vol.yml
# NEEDS the Secret db-creds from lab step 48.
#
# Mounted as a volume, each key becomes a file. This is the preferred way:
#   - the files live in a tmpfs (memory), so they are never written to the node's disk
#   - you control permissions (defaultMode 0400 = readable by the owner only)
#   - the files are refreshed when the Secret changes (not with subPath mounts)
#   - nothing ends up in the process environment
#
# EXPECT: `kubectl exec secret-vol -- ls -lL /etc/secret` shows two files with
#         mode -r--------, and `mount | grep /etc/secret` shows type tmpfs.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: secret-vol
  namespace: lab
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "sleep 86400"]
    volumeMounts:
    - name: creds
      mountPath: /etc/secret
      readOnly: true
  volumes:
  - name: creds
    secret:
      secretName: db-creds
      defaultMode: 0400            # octal file mode
