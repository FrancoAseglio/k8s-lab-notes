# =============================================================================
# pod-secret-env.yml  -  Secret values as environment variables (lab step 49)
# =============================================================================
# Used with:   kubectl apply -f pod-secret-env.yml
# NEEDS the Secret db-creds from lab step 48.
#
# `secretKeyRef` works like configMapKeyRef: the VALUE is injected into the
# container's environment (already decoded).
#
# Convenient, but environment variables leak easily: they are visible to every
# process in the container, are inherited by child processes, show up in crash
# dumps and debug output, and are readable by anyone who can `kubectl exec`.
# The pod's YAML only holds a REFERENCE, never the value.
#
# EXPECT: `kubectl exec secret-env -- env | grep DB_` shows the decoded values.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: secret-env
  namespace: lab
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "sleep 86400"]
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-creds
          key: username
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-creds
          key: password
