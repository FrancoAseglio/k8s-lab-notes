# =============================================================================
# secret-immutable.yml  -  an immutable Secret (used in lab step 51)
# =============================================================================
# Used with:   kubectl apply -f secret-immutable.yml
#
# Like an immutable ConfigMap: once created, its data can never change. To
# rotate the value you create a new Secret (name it with a version) and switch
# the workload to it. Protects against accidental overwrites and lowers API
# server load; makes the rotation an explicit, reviewable rollout.
#
# EXPECT: patching `stringData` fails with "field is immutable when
#         `immutable` is set".
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: locked
  namespace: lab
immutable: true
stringData:
  k: "v1"
