# =============================================================================
# secret.yml  -  a Secret written as YAML (used in lab step 48)
# =============================================================================
# Used with:   kubectl apply -f secret.yml
#
# A Secret is a ConfigMap for sensitive values (passwords, tokens, keys).
# The two differences that matter:
#   - the API handles it with a bit more care (not printed by `describe`, can be
#     mounted in memory, can be encrypted at rest, has its own RBAC verbs)
#   - values are BASE64-ENCODED in the API
#
# !!! BASE64 IS AN ENCODING, NOT ENCRYPTION. Anyone who can read the Secret can
# !!! decode it in one command. A Secret is protected by access control (RBAC)
# !!! and, optionally, encryption at rest. See steps 50 and 52-54.
#
# Two ways to write values:
#   data         values you must base64-encode yourself
#   stringData   plain text; the API server encodes it for you. It is WRITE-ONLY:
#                you will never see `stringData` when reading the object back.
# (If both define the same key, stringData wins.)
#
# `type` tells Kubernetes what the Secret is for and enables validation:
# Opaque (default, any keys), kubernetes.io/tls, kubernetes.io/dockerconfigjson,
# kubernetes.io/basic-auth, kubernetes.io/ssh-auth...
#
# EXPECT: `kubectl get secret api-key -o yaml` shows two keys under `data`
#         (token and legacy), both base64, and no `stringData`.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: api-key
  namespace: lab
type: Opaque
stringData:
  token: "abc123-written-as-plain-text"
data:
  legacy: bGVnYWN5LXZhbHVl         # base64 of "legacy-value"
