# =============================================================================
# tools.yml  -  two helper pods: curl and DNS tools (used in lab step 56)
# =============================================================================
# Used with:   kubectl apply -f tools.yml
#
# client     curl, to call the web pods by their stable DNS names
# dnsutils   nslookup, to look at what DNS answers
#
# EXPECT: both pods Running (1/1).
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: curl
    image: curlimages/curl:8.14.1
    command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: lab
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: dnsutils
    image: registry.k8s.io/e2e-test-images/agnhost:2.39
    imagePullPolicy: IfNotPresent
