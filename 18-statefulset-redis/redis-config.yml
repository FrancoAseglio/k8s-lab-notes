# =============================================================================
# redis-config.yml  -  Redis settings and start-up script (used in lab step 63)
# =============================================================================
# Used with:   kubectl apply -f redis-config.yml
#
# A ConfigMap (see the ConfigMaps lab) with two files, mounted at /conf:
#
#   redis.conf  the settings shared by every pod
#   start.sh    decides each pod's ROLE from its ordinal, which is the whole trick of
#               running a replicated database on a StatefulSet:
#                  redis-0  -> primary
#                  redis-1, redis-2... -> replicas of redis-0
#               It works because the pod name (and so the ordinal) is stable, and
#               because redis-0.redis is a stable DNS name for the primary.
#
# EXPECT: `kubectl get configmap redis-config` shows DATA 2.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: lab
data:
  redis.conf: |
    appendonly yes         
    dir /data              
    protected-mode no     
  start.sh: |
    #!/bin/sh
    name=$(hostname)                     
    ordinal=${name##*-}                  
    cp /conf/redis.conf /tmp/redis.conf 
    if [ "$ordinal" = "0" ]; then
      echo "[$name] starting as PRIMARY"
    else
      echo "replicaof redis-0.redis 6379" >> /tmp/redis.conf
      echo "[$name] starting as REPLICA of redis-0.redis"
    fi
    exec redis-server /tmp/redis.conf
