# =============================================================================
# app-lab.yml  -  whoami in namespace "lab" (used in lab steps 28-30)
# =============================================================================
# Used with:   kubectl apply -f app-lab.yml
#
# Deployment "whoami" plus Service "whoami-svc". `--name=lab` makes the app
# print "Name: lab", so you can see WHICH namespace's copy answered.
# A second Service, "lab-only-svc", exists only here, to demonstrate lookups
# that fail across namespaces.
#
# EXPECT: 2 pods READY 1/1 and two Services in namespace lab.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.11
        args: ["--name=lab"]
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-svc
  namespace: lab
spec:
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-only-svc
  namespace: lab
spec:
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80
