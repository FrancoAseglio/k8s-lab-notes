# =============================================================================
# app-dev.yml  -  whoami in namespace "dev" (used in lab steps 28-30)
# =============================================================================
# Used with:   kubectl apply -f app-dev.yml
#
# Exactly the same object NAMES as app-lab.yml (Deployment "whoami", Service
# "whoami-svc"), but in namespace "dev", and printing "Name: dev". Two
# namespaces can hold identical names without conflict.
#
# EXPECT: 2 pods READY 1/1 and Service whoami-svc in namespace dev.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.11
        args: ["--name=dev"]
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-svc
  namespace: dev
spec:
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80
