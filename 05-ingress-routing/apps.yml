# =============================================================================
# apps.yml  -  two apps, "red" and "blue" (used in lab steps 21-23)
# =============================================================================
# Used with:   kubectl apply -f apps.yml
#
# Two independent Deployments of the whoami server, each with its own ClusterIP
# Service. They differ only by name: `--name=red` / `--name=blue` makes each
# one print "Name: red" / "Name: blue" at the top of its response, so you can
# tell which backend answered. (The pod names, shown as Hostname, also start
# with red- or blue-.)
#
# EXPECT: 2 + 2 pods READY 1/1, and Services red-svc and blue-svc.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: red
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: red
  template:
    metadata:
      labels:
        app: red
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.11
        args: ["--name=red"]
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: red-svc
  namespace: lab
spec:
  selector:
    app: red
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue
  template:
    metadata:
      labels:
        app: blue
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.11
        args: ["--name=blue"]
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: blue-svc
  namespace: lab
spec:
  selector:
    app: blue
  ports:
  - port: 80
    targetPort: 80
