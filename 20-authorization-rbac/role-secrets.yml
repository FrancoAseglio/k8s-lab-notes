# =============================================================================
# role-secrets.yml  -  a Role that grants Secret access (used in lab step 73)
# =============================================================================
# Used with:   kubectl apply -f role-secrets.yml --as bob
#
# bob doesn't hold `get secrets`, so he must not be able to hand it out. The API server refuses
# with a message listing the permissions he is "attempting to grant ... not currently held".
# EXPECT: Forbidden (as bob); created normally when applied as the cluster admin.
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: lab
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
