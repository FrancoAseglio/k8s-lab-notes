# =============================================================================
# pods.yml  -  two pods to read, list and (try to) delete (used in lab step 70)
# =============================================================================
# Used with:   kubectl apply -f pods.yml
# Nothing special: two idle pods named web and db that give the RBAC experiments
# something to act on.
# EXPECT: web and db Running.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: lab
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: busybox
    image: busybox:1.37
    command: ["sh", "-c", "echo hello from web; sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: lab
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: busybox
    image: busybox:1.37
    command: ["sh", "-c", "echo hello from db; sleep 86400"]
